[workspace]
resolver = "2"
members = ["crates/trajectory-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

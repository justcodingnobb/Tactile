[workspace]
resolver = "2"
members = ["crates/tactile-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "1.0.0-beta.3"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

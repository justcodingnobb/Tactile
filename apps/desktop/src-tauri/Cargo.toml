[package]
name = "trajectory-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trajectory local input statistics"

[lib]
name = "trajectory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
trajectory-core = { path = "../../../crates/trajectory-core" }
trajectory-platform = { path = "../../../crates/trajectory-platform" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.3.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
rand = "0.9"

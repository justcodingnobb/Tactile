[package]
name = "trajectory-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
trajectory-core = { path = "../trajectory-core" }
rdev = { version = "0.5.3", features = ["serialize"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGDirectDisplay"] }

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "scripts/sync-site-version.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-site-version.mjs
          test -f site/index.html
          test -f site/assets/styles.css
          test -f site/assets/main.js
          test -f site/assets/version.js
          test -f site/assets/icon.png
          test -f site/favicon.ico
          node --check site/assets/main.js
          if grep -Eq '(src|href)="/assets/' site/index.html; then
            echo "Asset URLs must remain relative for project Pages hosting." >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    # Keep verification on macOS: the workspace includes Tauri's native Linux
    # dependencies, which are not installed on a bare Ubuntu runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Match tag to package and Cargo versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package ($package_version) or Cargo ($cargo_version)." >&2
            exit 1
          fi

  publish:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges each platform into latest.json. Publish serially so
      # two jobs cannot both read the previous manifest and overwrite each other.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis
            rust_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Keep the command at the repository root: tauri-action runs the
          # Tauri CLI from this directory, and beforeBuildCommand expects the
          # root package.json (npm run build).
          projectPath: "."
          tagName: ${{ github.ref_name }}
          releaseName: "Tactile ${{ github.ref_name }}"
          # Publish directly so releases/latest serves latest.json without a manual step.
          releaseDraft: false
          # releases/latest excludes prereleases, so beta tags must be normal releases.
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          # tauri-action's default naming appends the arch to .app.tar.gz, so
          # the aarch64 and x86_64 updater archives do not collide.
          args: ${{ matrix.args }}

  manifest:
    # tauri-action writes api.github.com asset URLs into latest.json. Those
    # count against GitHub's unauthenticated API limit (60/hour per IP) and
    # fail with 403 once it is used up, so point clients at the public
    # releases/download URLs instead. Signatures cover the files, not URLs.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Rewrite latest.json to public download URLs
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          gh release download "$TAG" --pattern latest.json --dir "$dir"
          gh release view "$TAG" --json assets \
            --jq '[.assets[] | {key: .apiUrl, value: .url}] | from_entries' > "$dir/urls.json"
          jq --slurpfile urls "$dir/urls.json" '
            .platforms |= map_values(
              .url = ($urls[0][.url] // .url)
              | if (.url | startswith("https://github.com/")) then .
                else error("unmapped updater URL: \(.url)") end)
          ' "$dir/latest.json" > "$dir/latest.fixed.json"
          mv "$dir/latest.fixed.json" "$dir/latest.json"
          jq -r '.platforms | to_entries[] | "\(.key) \(.value.url)"' "$dir/latest.json"
          gh release upload "$TAG" "$dir/latest.json" --clobber
